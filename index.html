<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7cc6ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>¡Vamos a la meta!</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- HUD durante el juego -->
      <div id="hud" class="hidden">
        <div id="stars" class="pill" aria-label="Estrellas">
          <span class="star-icon">⭐</span><span id="star-count">0</span>
        </div>
        <div id="progress" aria-label="Camino a la meta">
          <div id="progress-track"><div id="progress-fill"></div></div>
          <div id="progress-runner">🚂</div>
          <div id="progress-flag">🏁</div>
        </div>
        <button id="btn-pause" class="round small" aria-label="Pausa">⏸</button>
      </div>

      <!-- Botones de control -->
      <div id="controls" class="hidden">
        <button id="btn-left" class="round big" aria-label="Izquierda">⬅</button>
        <button id="btn-jump" class="round big jump" aria-label="Saltar">⬆</button>
        <button id="btn-right" class="round big" aria-label="Derecha">➡</button>
      </div>

      <!-- Pantalla de inicio -->
      <div id="screen-start" class="screen">
        <div class="card">
          <h1>¡Vamos a la meta!</h1>
          <p class="subtitle">La Estación</p>
          <button id="btn-play" class="round huge" aria-label="Jugar">▶</button>
          <div class="speed-picker" role="radiogroup" aria-label="Velocidad">
            <button class="speed" data-speed="slow" aria-label="Muy lento">🐢</button>
            <button class="speed selected" data-speed="medium" aria-label="Lento">🐇</button>
            <button class="speed" data-speed="normal" aria-label="Normal">🐎</button>
          </div>
          <button id="btn-sound" class="round small" aria-label="Sonido">🔊</button>
        </div>
      </div>

      <!-- Pausa -->
      <div id="screen-pause" class="screen hidden">
        <div class="card">
          <button id="btn-resume" class="round huge" aria-label="Seguir">▶</button>
          <button id="btn-home" class="round small" aria-label="Volver al inicio">🏠</button>
        </div>
      </div>

      <!-- Meta -->
      <div id="screen-finish" class="screen hidden">
        <div class="card">
          <div class="medal">🏅</div>
          <div class="finish-text">
            <h1>¡Llegaste a la meta!</h1>
            <p class="result"><span class="star-icon">⭐</span> <span id="final-stars">0</span></p>
          </div>
          <button id="btn-again" class="round huge" aria-label="Jugar otra vez">↻</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
